  - {match: "浦发银行", short: "浦发"}
  - {match: "光大银行", short: "光大"}
  - {match: "中信银行", short: "中信"}
  - {match: "四川天府银行", short: "天府"}
  - {match: "华夏银行", short: "华夏"}
  - {match: "浙商银行", short: "浙商"}
  - {match: "招商银行", short: "招商"}
  - {match: "中国银行", short: "中行"}
  - {match: "平安银行", short: "平安"}
  - {match: "建设银行", short: "建行"}
  - {match: "农业银行", short: "农行"}
  - {match: "宁波银行", short: "宁波"}
